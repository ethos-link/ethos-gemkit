name: Commit messages
on:
  workflow_call:
    inputs:
      toolkit-ref:
        description: Immutable Gemkit commit matching the workflow caller
        type: string
        required: true
permissions:
  contents: read
jobs:
  commitlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the pinned commit validator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ethos-link/ethos-gemkit
          ref: ${{ inputs.toolkit-ref }}
          path: .gemkit-tooling
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0.9'
      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ ! "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0{40}$ ]]; then
            git rev-list --no-merges "$HEAD_SHA" > "$RUNNER_TEMP/commits"
          else
            if [[ ! "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
            git rev-list --no-merges "$BASE_SHA..$HEAD_SHA" > "$RUNNER_TEMP/commits"
          fi
          while read -r commit; do
            git show -s --format=%B "$commit" > "$RUNNER_TEMP/message"
            ruby -I "$GITHUB_WORKSPACE/.gemkit-tooling/lib" "$GITHUB_WORKSPACE/.gemkit-tooling/exe/ethos-gemkit" commitlint --message "$RUNNER_TEMP/message"
          done < "$RUNNER_TEMP/commits"
