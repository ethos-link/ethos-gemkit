name: Gem release
on:
  workflow_call:
    inputs:
      rubygems-owner:
        description: Numeric RubyGems owner for pending trusted publishers
        type: string
        default: ''
    secrets:
      PACKAGES_TOKEN:
        description: GitHub Packages write token, only for the private host
        required: false
permissions:
  contents: read
concurrency:
  group: gem-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    outputs:
      gem: ${{ steps.build.outputs.gem }}
      host: ${{ steps.build.outputs.host }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0.9'
          bundler: '4.0.11'
          bundler-cache: true
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: git-cliff@2.12.0
      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh auth setup-git --hostname github.com
          bundle exec rake release:build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gem-${{ github.sha }}
          path: |
            pkg/${{ steps.build.outputs.gem }}
            pkg/release-notes.md
            pkg/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: rubygems
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0.9'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gem-${{ github.sha }}
      - run: sha256sum --check --strict SHA256SUMS
      - if: needs.build.outputs.host == 'https://rubygems.org'
        uses: ethos-link/configure-rubygems-credentials@9b2cf2e75bb26157e8b9909ce82f2736929cc571
        with:
          owner: ${{ inputs.rubygems-owner }}
      - name: Push the exact verified package with native RubyGems
        env:
          GEM_FILE: ${{ needs.build.outputs.gem }}
          GEM_HOST: ${{ needs.build.outputs.host }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [[ "$GEM_HOST" == https://rubygems.pkg.github.com/ethos-link ]]; then
            test -n "$PACKAGES_TOKEN"
            export GEM_HOST_API_KEY="Bearer $PACKAGES_TOKEN"
          fi
          gem push "$GEM_FILE" --host "$GEM_HOST"
  notes:
    needs: [build, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gem-${{ github.sha }}
      - run: sha256sum --check --strict SHA256SUMS
      - name: Create release notes from the verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          GEM_FILE: ${{ needs.build.outputs.gem }}
        run: gh release create "$RELEASE_TAG" "$GEM_FILE" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
