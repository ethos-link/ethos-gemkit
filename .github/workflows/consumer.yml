name: Gem verification
on:
  workflow_call:
    inputs:
      build-setup:
        description: Optional command to provision verification dependencies
        type: string
        default: ''
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '4.0.9'
          bundler: '4.0.11'
          bundler-cache: true
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: git-cliff@2.12.0
      - name: Set up consumer verification dependencies
        if: inputs.build-setup != ''
        run: ${{ inputs.build-setup }}
      - run: |
          bundle exec rake verify
          git status --short
          test -z "$(git status --porcelain)"
