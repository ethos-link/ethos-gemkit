name: Changelog configuration
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  changelog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2
        with:
          tool: git-cliff@2.12.0
      - run: git-cliff --config cliff.toml --unreleased --output "$RUNNER_TEMP/changelog.md"
