name: Publish verified RubyGems artifact
description: Validate the exact build artifact before configuring short-lived RubyGems credentials.
inputs:
  tag:
    description: Canonical release tag
    required: true
  commit:
    description: Verified release commit
    required: true
  gem-name:
    description: Expected gem name
    required: true
  owner:
    description: RubyGems numeric owner for trusted publishing
    required: true
  run-id:
    description: Source build run; empty means this run
    default: ''
  github-token:
    description: Token for downloading a previous run
    default: ''
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
      with:
        ruby-version: '4.0.9'
        bundler: '4.0.11'
    - name: Install trusted toolkit before credentials
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        echo "BUNDLE_WITHOUT=test" >> "$GITHUB_ENV"
        echo "BUNDLE_GEMFILE=$(realpath "$ACTION_ROOT/../../../Gemfile")" >> "$GITHUB_ENV"
        BUNDLE_GEMFILE="$(realpath "$ACTION_ROOT/../../../Gemfile")" BUNDLE_WITHOUT=test BUNDLE_FROZEN=true bundle install
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: release-${{ inputs.commit }}
        path: ${{ runner.temp }}/verified-release
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
    - name: Validate artifact before credentials
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.run-id || github.run_id }}
        RELEASE_DIRECTORY: ${{ runner.temp }}/verified-release
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        RELEASE_NAME: ${{ inputs.gem-name }}
      run: bundle exec ethos-gemkit artifact-verify --directory "$RELEASE_DIRECTORY" --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --name "$RELEASE_NAME" --host https://rubygems.org
    - uses: ethos-link/configure-rubygems-credentials@9b2cf2e75bb26157e8b9909ce82f2736929cc571
      with:
        owner: ${{ inputs.owner }}
    - name: Publish exact verified package or reconcile matching digest
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.run-id || github.run_id }}
        RELEASE_DIRECTORY: ${{ runner.temp }}/verified-release
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        RELEASE_NAME: ${{ inputs.gem-name }}
      run: bundle exec ethos-gemkit artifact-publish --directory "$RELEASE_DIRECTORY" --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --name "$RELEASE_NAME" --host https://rubygems.org
    - name: Retain confirmed publication receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: publication-${{ inputs.commit }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/verified-release/publication.json
        if-no-files-found: error
        retention-days: 90
