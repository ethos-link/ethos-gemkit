name: Recover verified release notes
description: Create GitHub release notes from the same artifact without registry credentials.
inputs:
  tag:
    description: Canonical release tag
    required: true
  commit:
    description: Verified release commit
    required: true
  gem-name:
    description: Expected gem name
    required: true
  run-id:
    description: Source build run; empty means this run
    default: ''
  github-token:
    description: Token for releases and previous-run artifact downloads
    required: true
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
      with:
        ruby-version: '4.0.9'
        bundler: '4.0.11'
    - name: Install trusted toolkit
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        echo "BUNDLE_WITHOUT=test" >> "$GITHUB_ENV"
        echo "BUNDLE_GEMFILE=$(realpath "$ACTION_ROOT/../../../Gemfile")" >> "$GITHUB_ENV"
        BUNDLE_GEMFILE="$(realpath "$ACTION_ROOT/../../../Gemfile")" BUNDLE_WITHOUT=test BUNDLE_FROZEN=true bundle install
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: release-${{ inputs.commit }}
        path: ${{ runner.temp }}/verified-release
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
    - name: Create or reconcile GitHub release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SOURCE_RUN_ID: ${{ inputs.run-id || github.run_id }}
        RELEASE_DIRECTORY: ${{ runner.temp }}/verified-release
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_COMMIT: ${{ inputs.commit }}
        RELEASE_NAME: ${{ inputs.gem-name }}
      run: bundle exec ethos-gemkit artifact-notes --directory "$RELEASE_DIRECTORY" --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --name "$RELEASE_NAME" --host https://rubygems.org
