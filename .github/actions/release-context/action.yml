name: Resolve canonical release recovery
description: Verify the source tag and build run before selecting an artifact.
inputs:
  tag:
    description: Existing annotated release tag
    required: true
  run-id:
    description: Original tag-push build run
    required: true
  github-token:
    description: Read token for workflow provenance
    required: true
outputs:
  commit:
    description: Canonical release commit
    value: ${{ steps.context.outputs.commit }}
runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
      with:
        ruby-version: '4.0.9'
        bundler: '4.0.11'
    - name: Install trusted toolkit
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}
      run: |
        echo "BUNDLE_GEMFILE=$(realpath "$ACTION_ROOT/../../../Gemfile")" >> "$GITHUB_ENV"
        BUNDLE_GEMFILE="$(realpath "$ACTION_ROOT/../../../Gemfile")" BUNDLE_FROZEN=true bundle install
    - id: context
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_REPOSITORY: ${{ github.repository }}
        RELEASE_TAG: ${{ inputs.tag }}
        SOURCE_RUN_ID: ${{ inputs.run-id }}
      run: |
        bundle exec ethos-gemkit release-context --repository "$RELEASE_REPOSITORY" --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID" > "$RUNNER_TEMP/release-context.json"
        ruby -rjson -e 'puts "commit=#{JSON.parse(File.read(ARGV.fetch(0))).fetch("commit")}"' "$RUNNER_TEMP/release-context.json" >> "$GITHUB_OUTPUT"
